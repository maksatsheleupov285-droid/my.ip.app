<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>IP Checker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <p>Определение IP...</p>
    <script>
        Telegram.WebApp.ready();
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                Telegram.WebApp.sendData(data.ip);
                document.body.innerHTML = '<p>Ваш IP: ' + data.ip + '</p><p>Отправлено боту!</p>';
            })
            .catch(() => {
                Telegram.WebApp.sendData('IP не получен');
                document.body.innerHTML = '<p>Ошибка получения IP</p>';
            });
    </script>
</body>
</html>
